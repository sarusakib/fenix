name: FeniX CI

on:
  push:
    branches:
      - main
      - "auto-fix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fenix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/fenix-brain-source-refresh/index.ts

      - name: Production build
        run: npm run build
