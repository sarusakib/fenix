name: FeniX CI

on:
  push:
    branches:
      - main
      - "auto-fix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fenix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repository currently has no package-lock.json, so npm ci and
      # setup-node's npm cache cannot be used safely. Use the same install
      # model Vercel uses for this lockfile-free repository.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
