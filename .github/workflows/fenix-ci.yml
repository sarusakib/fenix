name: FeniX CI

on:
  push:
    branches:
      - main
      - "auto-fix/**"
      - "feat/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fenix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      npm_config_ignore_scripts: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (lifecycle scripts disabled)
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/fenix-brain-source-refresh/index.ts

      - name: Production build
        run: npm run build
